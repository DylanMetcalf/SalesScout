# Render Blueprint for Sales Scout.
# In Render: New + → Blueprint → pick this GitHub repo → Apply.
#
# Sales Scout stores its data in SQLite and runs research jobs inside the web
# process, so it runs as ONE instance with a persistent disk. Persistent disks
# need a paid instance type (Starter or above) — on the free plan all data is
# wiped on every deploy or restart.
services:
  - type: web
    name: sales-scout
    runtime: node
    plan: starter
    region: frankfurt # change to the region closest to you
    buildCommand: npm ci --include=dev && npm run build # build tools are devDependencies
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true # redeploys when you push to the connected branch
    disk:
      name: sales-scout-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_PATH
        value: /var/data/salesscout.db
      # Encrypts API keys that people paste into Settings. Generated once by Render; never change it.
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      # Server-wide AI key: used for every account that hasn't pasted its own. You enter it in the dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Your login email(s), comma-separated. These accounts use the server key free of
      # limits and get the Admin back office. Set it before anyone else signs up.
      - key: ADMIN_EMAILS
        sync: false
      # "false" = invite-only (admins can always sign up). Either way, new accounts must
      # bring their own AI key unless you grant them yours in Admin.
      # Set in the dashboard (Environment tab) so blueprint syncs never overwrite it.
      - key: ALLOW_SIGNUPS
        sync: false
      # Your scheduling page (Calendly / Cal.com / Google appointment schedule).
      # It creates the Zoom or Google Meet link; the Contact page shows the calendar.
      - key: BOOKING_URL
        sync: false
      # Resend API key: emails each website enquiry to ENQUIRY_EMAIL (default: site contact email).
      - key: RESEND_API_KEY
        sync: false
